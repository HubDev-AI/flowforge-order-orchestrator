[project]
name = "flowforge-bus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["flowforge-contracts", "aio-pika==10.1.1"]

[build-system]
requires = ["uv_build>=0.12.18,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bus"

[tool.uv.sources]
flowforge-contracts = { workspace = true }
